name: Verify
on:
  pull_request:
  push:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1, MIT
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, MIT
        with:
          node-version: 22.23.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run stage:pages
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser -- --project=chromium
        env:
          ANIMATOR_TEST_PORT: 4510
      - run: npm run test:release
        env:
          ANIMATOR_TEST_PORT: 4512
      - name: Archive the exact tested site for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C _site .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, MIT
        if: github.event_name == 'workflow_dispatch'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
